<!doctype html>
<html lang="ml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ariyippu Generator</title>
    <meta
      name="description"
      content="Compose the weekly parish notice (Ariyippu) in English, Malayalam or Manglish and export a print-ready PDF."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23090d16' stroke='%2322d3ee'/><path d='M9 9h14M9 15h14M9 21h9' stroke='%2322d3ee' stroke-width='2.5' stroke-linecap='round'/></svg>"
    />
    <script>
      // Apply the saved (or system) colour theme before first paint, so a
      // light-theme user never sees a dark flash. Keep in sync with main.jsx.
      (function () {
        var theme;
        try {
          theme = JSON.parse(localStorage.getItem("ariyippu-notice-v1")).state.theme;
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
